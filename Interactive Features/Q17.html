<!DOCTYPE html>
<html>
<head>
<title>Form Validation</title>
<style>
 /*Form Validation*/ 
body {
  font-family: verdana;
  background: #F3F4F6;
  display:flex;
  justify-content:center;
  align-items:center;
  height:800px;
}
.form-box {
  background:rgb(232, 210, 252);
  padding:30px;
  width:350px;
  border-radius:10px;
}
input {
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:5px;

}
button {
  width:360px;
  padding:10px;
  background: #b1a4ed;
  color: black;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
button:hover { 
  background:#5563c1; 
}
</style>
</head>
<body>
<div class="form-box">
<h2 style="text-align: center;">Register</h2>
<form onsubmit="return validate()">
<input type="text" id="name" placeholder="Name">
<input type="text" id="email" placeholder="Email">
<button type="submit">Submit</button>
</form>
</div>
<script>
function validate(){
let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(name===""||email===""){ alert("All fields required"); return false;}
if(!pattern.test(email)){ alert("Invalid email"); return false;}
alert("Registered Successfully!");
return true;
}
</script>
</body>
</html>
