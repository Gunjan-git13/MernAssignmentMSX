<!DOCTYPE html>
<html>
<head>
<title>Typing Animation</title>
<style>
 /*Typing Animation*/ 
body {
  background:#F3F4F6;
  color: #9576f5;
  font-family:monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-size:30px;
}
</style>
</head>
<body>

<div id="text"></div>

<script>
let msg="Welcome to Interactive JavaScript!!";
let i=0;
function type(){
if(i<msg.length){
document.getElementById("text").innerHTML+=msg.charAt(i);
i++;
setTimeout(type,80);
}
}
type();
</script>

</body>
</html>
