<!DOCTYPE html>
<html>
<head>
<title>Slideshow</title>
<style>
/*Slideshow*/
body {
  font-family: verdana;
  background: #F3F4F6;
  text-align: center;
  padding: 30px;
}
.slideshow {
  background: rgb(232, 210, 252);
  width: 450px;
  margin: auto;
  padding: 20px;
  
}
img {
  width: 100%;
  height: 250px;
  border-radius: 5px;
  object-fit: cover;
}
button {
  padding: 10px 15px;
  margin: 10px;
  border: none;
  background: #b1a4ed;
  color: black;
  border-radius: 5px;
  cursor: pointer;
}
button:hover {
  background: #9576f5;
}
</style>
</head>
<body>
<div class="slideshow">
<h2>Image Slideshow</h2>
<img id="slide" src="https://picsum.photos/id/1015/600/400"><br>
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>
</div>
<script>
let images=[
"https://picsum.photos/id/1015/600/400",
"https://picsum.photos/id/1016/600/400",
"https://picsum.photos/id/1018/600/400",
"https://picsum.photos/id/1020/600/400",
];
let index=0;
function show(){ document.getElementById("slide").src=images[index]; }
function next(){ index=(index+1)%images.length; show(); }
function prev(){ index=(index-1+images.length)%images.length; show(); }
</script>

</body>
</html>
