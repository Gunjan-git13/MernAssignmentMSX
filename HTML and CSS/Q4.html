<!DOCTYPE html>
<html>
<head>
<title>3-Column Feature Section</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/*3-Column Feature Section*/
body {
    margin: 0;
    font-family: Verdana;
    background-color: #F3F4F6;
}
.features-section {
    padding: 60px 20px;
    text-align: center;
    color: #1F2937;
}
.features-section h2 {
    margin-bottom: 50px;
    font-size: 36px;
}
.features-grid {
    display: grid;
    grid-template-columns: repeat(3, 2fr);
    gap: 40px;
    max-width: 1000px;
    margin: auto;
}
.feature-box {
    background: #EDE9FE;
    padding: 30px;
    border-radius: 10px;
}
.feature-box:hover {
    transform: translateY(-10px);
    background: #DDD6FE;
}
.feature-box i {
    font-size: 40px;
    color: #A78BFA;
    margin-bottom: 20px;
}
.feature-box h3 {
    margin-bottom: 15px;
    color: #1F2937;
}
.feature-box p {
    font-size: 14px;
    color: #4B5563;
}
@media (max-width: 768px) {
    .features-grid {
        grid-template-columns: 2fr;
    }
}
</style>
</head>
<body>
<section class="features-section">
    <h2>Our Features</h2>

    <div class="features-grid">
        
        <div class="feature-box">
            <i class="fas fa-bolt"></i>
            <h3>Efficient  Performance</h3>
            <p>Blazing fast performance that keeps everything running smoothly.</p>
        </div>

        <div class="feature-box">
            <i class="fas fa-shield-alt"></i>
            <h3>Safe & Secure</h3>
            <p>Built with strong protection to ensure complete safety and reliability.</p>
        </div>

        <div class="feature-box">
            <i class="fas fa-mobile-alt"></i>
            <h3>Cross-Platform Support</h3>
            <p>Optimized for mobile, tablet, and desktop for a seamless experience.</p>
        </div>

    </div>
</section>

</body>
</html>
