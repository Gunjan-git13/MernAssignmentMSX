<!DOCTYPE html>
<html>
<head>
    <title>Hover Button</title>
    <style>
        /*Hover Button*/
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 800px;
            margin: 0;
            background-color: #F3F4F6;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #ccc4ee;
            color: 1F2937;
            cursor: pointer;
            transition: 0.3s ease;
        }
        button:hover {
            background-color: #A78BFA;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <button>Click here</button>

</body>
</html>
