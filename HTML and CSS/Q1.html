<!DOCTYPE html>
<html>
    <head>
        <title>Personal Information Card</title>
    </head>
    
    <style>
        /* Personal Information Card */
        body {
            font-family: Verdana;
            background-color: #F3F4F6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 800px;
        }
        .card{
            background-color: #EDE9FE;
            width: 400px;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .photo {
            width: 120px;
            height: 120px;
            background-color: #A78BFA;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
        .info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        h2 {
            margin: center;
            color: #1F2937;
        }
        p {
            margin: 0;
            color: #4B5563;
        }
    </style>
    <body>
        <div class="card">
            <div class="photo">Photo</div>
            <div class="info">
                <h3>Gunjan Vijay Dandekar</h3>
                <p>gunjan@gmail.com</p>
                <P>1234567890</P>
            </div>
        </div>
    </body>
</html>
