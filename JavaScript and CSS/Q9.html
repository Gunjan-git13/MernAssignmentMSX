<!DOCTYPE html>
<html>
<head>
<title>Modal Popup</title>
<style>
/*Model Popup*/
body { 
    font-family: Arial; 
    text-align: center; 
    background-color: #F3F4F6;
}
button {
    padding: 10px 20px;
    margin-top: 40px;
    background: #b1a4ed;
    color: black;
}

.modal {
    display: none;
    position: fixed;
    left: 0; top: 0;
    width: 100%; 
    height: 100%;
    background: rgba(0,0,0,0.5);
}
button:hover {
  background: #9576f5;
}
.modal-content {
    background: #d2c9f9;
    width: 300px;
    padding: 20px;
    margin: 15% auto;
    position: relative;
    border: none;
}
.close {
    position: absolute;
    right: 10px;
    top: 5px;
    cursor: pointer;
    font-size: 18px;
}
</style>
</head>
<body>
<h2>Modal Example</h2>
<button onclick="openModal()" style="border: none;">View Popup</button>
<div class="modal" id="myModal" onclick="outsideClick(event)">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">X</span>
        <p>This is a popup For Model!</p>
    </div>
</div>
<script>
function openModal() {
    document.getElementById("myModal").style.display = "block";
}

function closeModal() {
    document.getElementById("myModal").style.display = "none";
}

function outsideClick(event) {
    if (event.target.id === "myModal") {
        closeModal();
    }
}
</script>

</body>
</html>
