<!DOCTYPE html>
<html>
<head>
<title>Progress Bar</title>
<style>
body { font-family: Arial; padding: 40px;
background-color: F3F4F6;
}

.progress-container {
    width: 80%;
    background: #EDE9FE;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0;
    height: 30px;
    background: #A78BFA;
    border-radius: 20px;
    animation: fill 3s forwards;
}

@keyframes fill {
    from { width: 0; }
    to { width: 80%; }
}
</style>
</head>
<body>

<h2>Progress Bar</h2>

<div class="progress-container">
    <div class="progress-bar"></div>
</div>

</body>
</html>
