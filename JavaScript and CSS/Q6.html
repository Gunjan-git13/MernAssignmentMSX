<!DOCTYPE html>
<html>
<head>
<title>Image Gallery</title>
<style>
/*Image Gallery*/
body { font-family: Verdana; background:#F3F4F6; 
}
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    max-width: 900px;
    margin: 40px auto;
}
.gallery div {
    overflow: hidden;
}
.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    transition: transform 0.4s ease;
}
.gallery div:hover img {
    transform: scale(1.1);
}
.h2 {
    color: red;
    font-family: 'Courier New';
    justify-content: center;
}
</style>
</head>
