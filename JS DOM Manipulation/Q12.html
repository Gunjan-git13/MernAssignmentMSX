<!DOCTYPE html>
<html>
<head>
<title>To Do List</title>
<style>
/*To Do List*/    
body { 
    font-family:Arial; 
    padding:40px;
    background-color: #F3F4F6;
    justify-content: center;
 }
input {
    padding:10px; 
    width:250px; 
}
li {
    margin:10px 0;
}
button { 
    margin-left:10px; 
    background: #b1a4ed;
    border: none;  
}
button:hover {
  background: #9576f5;
}
</style>
</head>
<body>
<h2>To-Do List</h2>
<input type="text" id="taskInput" style="background-color: #e0dafa; color: black; border: none; "  placeholder="Enter task and press Enter">
<ul id="taskList"></ul>
<script>
let input = document.getElementById("taskInput");
let list = document.getElementById("taskList");
input.addEventListener("keypress", function(event){
    if(event.key === "Enter" && input.value !== "") {
        let li = document.createElement("li");
        li.textContent = input.value;

        let deleteBtn = document.createElement("button");
        deleteBtn.textContent = "X";
        deleteBtn.onclick = function() {
            li.remove();
        };

        li.appendChild(deleteBtn);
        list.appendChild(li);

        input.value = "";
    }
});
</script>
</body>
</html>
